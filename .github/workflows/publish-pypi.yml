name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository_url:
        description: "Upload target"
        required: true
        default: "https://upload.pypi.org/legacy/"
        type: choice
        options:
          - https://upload.pypi.org/legacy/
          - https://test.pypi.org/legacy/

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish (with attestations / provenance)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          repository-url: ${{ github.event_name == 'workflow_dispatch' && inputs.repository_url || 'https://upload.pypi.org/legacy/' }}
          packages-dir: dist/
