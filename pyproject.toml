[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepaft"
version = "0.1.2"
description = "Deep accelerated failure time models (Norman et al., 2024): Buckley–James, IPCW, and transform losses with extensions for covariate-dependent censoring, degenerate IPCW, and group residual scale."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Swati" }]
keywords = [
    "survival-analysis",
    "accelerated-failure-time",
    "deep-learning",
    "censoring",
    "glioma",
    "tcga",
    "brats",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "torch>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
metrics = ["scikit-survival>=0.22", "lifelines>=0.28"]
experiments = [
    "scikit-survival>=0.22",
    "lifelines>=0.28",
    "requests>=2.31",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "nibabel>=5.0",
    "pyradiomics>=3.0.1",
    "synapseclient>=4.0",
]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.urls]
Homepage = "https://github.com/swatipriyadarshini9/deepaft"
Documentation = "https://github.com/swatipriyadarshini9/deepaft#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
